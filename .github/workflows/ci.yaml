#CI FOR PRODUCT CATALOGUE SERVICE

name: product-catalog-service

on:
  pull_request:
    branches:  
        - main

permissions:
  contents: write
      
jobs:
    build:
        runs-on: ubuntu-latest
    
        steps:
        - name: Checkout code
          uses: actions/checkout@v6
        
        - name: Setup Go
          uses: actions/setup-go@v6
          with: 
            go-version: '1.26'
                        
        - name: Build
          run: |
            cd src/product-catalog
            go mod download
            go build -o product-catalog-service main.go

        - name: unit tests
          run: |
            cd src/product-catalog
            go test ./...

    code-quality:
        runs-on: ubuntu-latest
          
        steps:
        - name: Checkout code
          uses: actions/checkout@v6
        
        - name: Run golangci-lint
          uses: golangci/golangci-lint-action@v6
          with:
            version: v1.59.2
            working-directory: src/product-catalog

    docker:
        runs-on: ubuntu-latest
          
        needs: build
        steps:
        - name: Checkout code
          uses: actions/checkout@v6
        
        - name: install docker
          uses: docker/setup-buildx-action@v4

        - name: login to docker
          uses: docker/login-action@v4
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Docker push
          uses: docker/build-push-action@v7
          with:
            context: src/product-catalog
            file: src/product-catalog/Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{github.run_id}}
            
    updatek8s:
        runs-on: ubuntu-latest
          
        needs: docker
        steps:
        - name: Checkout code
          uses: actions/checkout@v6
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: update k8s deployment manifest
          run: |
                sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml
        - name: Commit and push changes
          run: |
                git config --global user.name "Abhi-Platform"
                git config --global user.email "akottapalli9@gmail.com"
                git add kubernetes/productcatalog/deploy.yaml
                git commit -m "[CI]:Update product-catalog image tag"
                git fetch origin main
                git rebase origin/main
                git push origin HEAD:main
